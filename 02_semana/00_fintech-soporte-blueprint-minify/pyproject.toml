[project]
name = "fintech-soporte-blueprint-minify"
version = "0.1.0"
description = "Minimal resilient LLM support chat blueprint (fintech)"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
