[project]
name = "fde-techstore-garantias"
version = "0.1.0"
description = "Motor LLM base con Groq, validacion Pydantic y config.toml para triaje de garantias de TechStore (PE2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
