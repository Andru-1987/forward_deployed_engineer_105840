[project]
name = "fde-mesa-ayuda"
version = "0.1.0"
description = "Motor LLM base de la Mesa de Ayuda IT: Preentrega 2 del curso Forward Deployed Engineer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.13.0",
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "openai>=3.59.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
